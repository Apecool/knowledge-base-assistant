# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: kb-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kb-postgres
          property: connectionString
      - key: CHROMA_PERSIST_DIR
        value: /var/data/chroma
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: LLM_PROVIDER
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_API_BASE
        value: https://api.deepseek.com/v1
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: SENTRY_DSN
        sync: false
      - key: LOGTAIL_TOKEN
        sync: false
    disk:
      name: chroma-data
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: kb-postgres
    databaseName: knowledge_base
    user: kb_user
    plan: free